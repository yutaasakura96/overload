<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap">
  <style>
    body { margin: 0; }
    a { color: #3FB6D4; }
    a:hover { color: #6FCDE3; }
  </style>
</helmet>

<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; background: #0B0D0F; overflow: hidden; font-family: 'IBM Plex Sans', system-ui, sans-serif;">

  <!-- app bar -->
  <div style="display: flex; align-items: center; gap: 12px; padding: 18px 16px 14px 16px; border-bottom: 1px solid #1A2026;">
    <div style="width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; margin-left: -6px;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8A96A3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5 8 12l7 7"></path></svg>
    </div>
    <div style="font-size: 12px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #E6EDF3;">Bench Press</div>
  </div>

  <!-- headline stat -->
  <div style="padding: 18px 16px 0 16px; display: flex; align-items: flex-end; justify-content: space-between;">
    <div style="display: flex; flex-direction: column; gap: 6px;">
      <div style="font-size: 9px; letter-spacing: 0.12em; color: #4A5560;">ESTIMATED 1RM</div>
      <div style="display: flex; align-items: baseline; gap: 8px;">
        <div style="font-family: 'JetBrains Mono', monospace; font-size: 42px; font-weight: 500; line-height: 0.9; letter-spacing: -0.03em; color: #E6EDF3;">110.0</div>
        <div style="font-family: 'JetBrains Mono', monospace; font-size: 14px; color: #5A6673;">kg</div>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 5px; padding-bottom: 3px;">
      <div style="font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #57C99A;">+11.3</div>
      <div style="font-size: 9px; letter-spacing: 0.08em; color: #4A5560;">OVER 12W</div>
    </div>
  </div>

  <!-- span selector -->
  <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 5px; padding: 16px 16px 0 16px;">
    <div style="height: 44px; display: flex; align-items: center; justify-content: center; border: 1px solid #1A2026; border-radius: 2px;"><div style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #5A6673;">4W</div></div>
    <div style="height: 44px; display: flex; align-items: center; justify-content: center; border: 1px solid #3FB6D4; border-radius: 2px; background: #10262E;"><div style="font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; color: #3FB6D4;">12W</div></div>
    <div style="height: 44px; display: flex; align-items: center; justify-content: center; border: 1px solid #1A2026; border-radius: 2px;"><div style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #5A6673;">6M</div></div>
    <div style="height: 44px; display: flex; align-items: center; justify-content: center; border: 1px solid #1A2026; border-radius: 2px;"><div style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #5A6673;">1Y</div></div>
    <div style="height: 44px; display: flex; align-items: center; justify-content: center; border: 1px solid #1A2026; border-radius: 2px;"><div style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #5A6673;">ALL</div></div>
  </div>

  <!-- chart -->
  <div style="padding: 20px 16px 0 16px;">
    <svg width="358" height="192" viewBox="0 0 358 192" fill="none" xmlns="http://www.w3.org/2000/svg">
      <line x1="0" y1="26.7" x2="358" y2="26.7" stroke="#1A2026" stroke-width="1"></line>
      <line x1="0" y1="76.7" x2="358" y2="76.7" stroke="#1A2026" stroke-width="1"></line>
      <line x1="0" y1="126.7" x2="358" y2="126.7" stroke="#1A2026" stroke-width="1"></line>
      <line x1="0" y1="160" x2="358" y2="160" stroke="#232B32" stroke-width="1"></line>

      <text x="356" y="23" text-anchor="end" fill="#3C464F" font-family="JetBrains Mono, monospace" font-size="9">110</text>
      <text x="356" y="73" text-anchor="end" fill="#3C464F" font-family="JetBrains Mono, monospace" font-size="9">104</text>
      <text x="356" y="123" text-anchor="end" fill="#3C464F" font-family="JetBrains Mono, monospace" font-size="9">98</text>

      <polyline points="14,44 44,47 74,50 104,52 134,57 164,60 194,63 224,68 254,71 284,76 314,79 344,84" stroke="#E0A83C" stroke-width="1.5" stroke-dasharray="3 3" stroke-linecap="round" stroke-linejoin="round" opacity="0.75"></polyline>

      <polyline points="14,126.7 44,115.8 74,120.8 104,99.2 134,87.5 164,93.3 194,70.8 224,60 254,65.8 284,54.2 314,43.3 344,26.7" stroke="#3FB6D4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></polyline>

      <circle cx="14" cy="126.7" r="2.5" fill="#0B0D0F" stroke="#3FB6D4" stroke-width="1.5"></circle>
      <circle cx="44" cy="115.8" r="2.5" fill="#0B0D0F" stroke="#3FB6D4" stroke-width="1.5"></circle>
      <circle cx="74" cy="120.8" r="2.5" fill="#0B0D0F" stroke="#3FB6D4" stroke-width="1.5"></circle>
      <circle cx="104" cy="99.2" r="2.5" fill="#0B0D0F" stroke="#3FB6D4" stroke-width="1.5"></circle>
      <circle cx="134" cy="87.5" r="2.5" fill="#0B0D0F" stroke="#3FB6D4" stroke-width="1.5"></circle>
      <circle cx="164" cy="93.3" r="2.5" fill="#0B0D0F" stroke="#3FB6D4" stroke-width="1.5"></circle>
      <circle cx="194" cy="70.8" r="2.5" fill="#0B0D0F" stroke="#3FB6D4" stroke-width="1.5"></circle>
      <circle cx="224" cy="60" r="2.5" fill="#0B0D0F" stroke="#3FB6D4" stroke-width="1.5"></circle>
      <circle cx="254" cy="65.8" r="2.5" fill="#0B0D0F" stroke="#3FB6D4" stroke-width="1.5"></circle>
      <circle cx="284" cy="54.2" r="2.5" fill="#0B0D0F" stroke="#3FB6D4" stroke-width="1.5"></circle>
      <circle cx="314" cy="43.3" r="2.5" fill="#0B0D0F" stroke="#3FB6D4" stroke-width="1.5"></circle>
      <circle cx="344" cy="26.7" r="3.5" fill="#3FB6D4"></circle>

      <text x="14" y="178" fill="#3C464F" font-family="JetBrains Mono, monospace" font-size="9">24 JUN</text>
      <text x="179" y="178" text-anchor="middle" fill="#3C464F" font-family="JetBrains Mono, monospace" font-size="9">5 AUG</text>
      <text x="344" y="178" text-anchor="end" fill="#3C464F" font-family="JetBrains Mono, monospace" font-size="9">16 SEP</text>
    </svg>
  </div>

  <!-- secondary stats -->
  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; padding: 6px 16px 0 16px;">
    <div style="border: 1px solid #1A2026; border-radius: 2px; padding: 12px; display: flex; flex-direction: column; gap: 6px;">
      <div style="font-size: 9px; letter-spacing: 0.1em; color: #4A5560;">TOP SET</div>
      <div style="display: flex; align-items: baseline; gap: 6px;">
        <div style="font-family: 'JetBrains Mono', monospace; font-size: 20px; font-weight: 500; color: #E6EDF3;">82.5</div>
        <div style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #5A6673;">× 10</div>
      </div>
    </div>
    <div style="border: 1px solid #1A2026; border-radius: 2px; padding: 12px; display: flex; flex-direction: column; gap: 6px;">
      <div style="font-size: 9px; letter-spacing: 0.1em; color: #4A5560;">VOLUME LOAD</div>
      <div style="display: flex; align-items: baseline; gap: 6px;">
        <div style="font-family: 'JetBrains Mono', monospace; font-size: 20px; font-weight: 500; color: #E6EDF3;">2,475</div>
        <div style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #5A6673;">kg</div>
      </div>
    </div>
  </div>

  <!-- overlays -->
  <div style="padding: 20px 16px 0 16px; display: flex; flex-direction: column; gap: 9px;">
    <div style="font-size: 9px; letter-spacing: 0.12em; color: #4A5560;">OVERLAY</div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 7px;">
      <div style="height: 46px; display: flex; align-items: center; gap: 9px; padding: 0 12px; border: 1px solid #4A3A1C; border-radius: 2px; background: #1A1509;">
        <div style="width: 14px; height: 2px; background: #E0A83C;"></div>
        <div style="font-size: 11px; letter-spacing: 0.06em; color: #E0A83C;">WEIGHT TREND</div>
      </div>
      <div style="height: 46px; display: flex; align-items: center; gap: 9px; padding: 0 12px; border: 1px solid #1A2026; border-radius: 2px;">
        <div style="width: 14px; height: 2px; background: #2A3440;"></div>
        <div style="font-size: 11px; letter-spacing: 0.06em; color: #5A6673;">INTAKE</div>
      </div>
      <div style="height: 46px; display: flex; align-items: center; gap: 9px; padding: 0 12px; border: 1px solid #1A2026; border-radius: 2px;">
        <div style="width: 14px; height: 2px; background: #2A3440;"></div>
        <div style="font-size: 11px; letter-spacing: 0.06em; color: #5A6673;">SLEEP</div>
      </div>
      <div style="height: 46px; display: flex; align-items: center; gap: 9px; padding: 0 12px; border: 1px solid #1A2026; border-radius: 2px;">
        <div style="width: 14px; height: 2px; background: #2A3440;"></div>
        <div style="font-size: 11px; letter-spacing: 0.06em; color: #5A6673;">HRV</div>
      </div>
    </div>
  </div>

  <!-- epley note -->
  <div style="position: absolute; left: 16px; right: 16px; bottom: 18px; display: flex; align-items: center; justify-content: space-between; padding-top: 12px; border-top: 1px solid #1A2026;">
    <div style="font-size: 10px; color: #4A5560;">e1RM from the best working set</div>
    <div style="font-family: 'JetBrains Mono', monospace; font-size: 10px; color: #3C464F;">Epley · w × (1 + r/30)</div>
  </div>

</div>
</x-dc>
</body>
</html>
