<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap">
  <style>
    body { margin: 0; }
    a { color: #3FB6D4; }
    a:active { color: #6FCDE3; }
  </style>
</helmet>

<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; background: #0B0D0F; overflow: hidden; font-family: 'IBM Plex Sans', system-ui, sans-serif;">

  <!-- app bar -->
  <div style="display: flex; align-items: center; gap: 6px; padding: 18px 16px 14px 16px; border-bottom: 1px solid #1A2026;">
    <div style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; margin: -7px 0 -7px -14px;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8A96A3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5 8 12l7 7"></path></svg>
    </div>
    <div style="font-size: 12px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #E6EDF3;">Bench Press</div>
    <!-- data-state slot, resting state: last sync time (10 §7.4) -->
    <div style="margin-left: auto; display: flex; align-items: center; gap: 6px;">
      <div style="width: 5px; height: 5px; border-radius: 50%; background: #57C99A;"></div>
      <div style="font-family: 'JetBrains Mono', monospace; font-size: 10px; color: #738393;">SYNCED 06:41</div>
    </div>
  </div>

  <!-- headline stat -->
  <div style="padding: 18px 16px 0 16px; display: flex; align-items: flex-end; justify-content: space-between;">
    <div style="display: flex; flex-direction: column; gap: 6px;">
      <div style="font-size: 9px; letter-spacing: 0.12em; color: #738393;">ESTIMATED 1RM</div>
      <div style="display: flex; align-items: baseline; gap: 8px;">
        <div style="font-family: 'JetBrains Mono', monospace; font-size: 42px; font-weight: 500; line-height: 0.9; letter-spacing: -0.03em; color: #E6EDF3;">110.0</div>
        <div style="font-family: 'JetBrains Mono', monospace; font-size: 14px; color: #738393;">kg</div>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 5px; padding-bottom: 3px;">
      <div style="font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #57C99A;">+11.3</div>
      <div style="font-size: 9px; letter-spacing: 0.08em; color: #738393;">OVER 12W</div>
    </div>
  </div>

  <!-- span selector -->
  <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 5px; padding: 16px 16px 0 16px;">
    <div style="height: 44px; display: flex; align-items: center; justify-content: center; border: 1px solid #1A2026; border-radius: 2px;"><div style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #738393;">4W</div></div>
    <div style="height: 44px; display: flex; align-items: center; justify-content: center; border: 1px solid #3FB6D4; border-radius: 2px; background: #10262E;"><div style="font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; color: #3FB6D4;">12W</div></div>
    <div style="height: 44px; display: flex; align-items: center; justify-content: center; border: 1px solid #1A2026; border-radius: 2px;"><div style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #738393;">6M</div></div>
    <div style="height: 44px; display: flex; align-items: center; justify-content: center; border: 1px solid #1A2026; border-radius: 2px;"><div style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #738393;">1Y</div></div>
    <div style="height: 44px; display: flex; align-items: center; justify-content: center; border: 1px solid #1A2026; border-radius: 2px;"><div style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #738393;">ALL</div></div>
  </div>

  <!-- chart: plot 24→290, 64px right gutter holds overlay end labels; e1RM value labels on the left edge (05 §5) -->
  <div style="padding: 20px 16px 0 16px;">
    <svg width="358" height="192" viewBox="0 0 358 192" fill="none" xmlns="http://www.w3.org/2000/svg">
      <line x1="0" y1="26.7" x2="358" y2="26.7" stroke="#1A2026" stroke-width="1"></line>
      <line x1="0" y1="76.7" x2="358" y2="76.7" stroke="#1A2026" stroke-width="1"></line>
      <line x1="0" y1="126.7" x2="358" y2="126.7" stroke="#1A2026" stroke-width="1"></line>
      <line x1="0" y1="160" x2="358" y2="160" stroke="#232B32" stroke-width="1"></line>

      <text x="0" y="22.7" fill="#738393" font-family="JetBrains Mono, monospace" font-size="9">110</text>
      <text x="0" y="72.7" fill="#738393" font-family="JetBrains Mono, monospace" font-size="9">104</text>
      <text x="0" y="122.7" fill="#738393" font-family="JetBrains Mono, monospace" font-size="9">98</text>

      <polyline points="24.0,44 48.2,47 72.4,50 96.5,52 120.7,57 144.9,60 169.1,63 193.3,68 217.5,71 241.6,76 265.8,79 290.0,84" stroke="#E0A83C" stroke-width="1.5" stroke-dasharray="3 3" stroke-linecap="round" stroke-linejoin="round" opacity="0.75"></polyline>
      <polyline points="24.0,96 48.2,88 72.4,92 96.5,80 120.7,84 144.9,90 169.1,78 193.3,74 217.5,82 241.6,76 265.8,72 290.0,70" stroke="#8C7BE8" stroke-width="1.5" stroke-dasharray="6 3" stroke-linecap="round" stroke-linejoin="round" opacity="0.75"></polyline>
      <polyline points="24.0,110 48.2,118 72.4,104 96.5,112 120.7,120 144.9,108 169.1,114 193.3,102 217.5,110 241.6,98 265.8,104 290.0,95" stroke="#DCD6CA" stroke-width="1.5" stroke-dasharray="1.5 3" stroke-linecap="round" stroke-linejoin="round" opacity="0.75"></polyline>
      <polyline points="24.0,130 48.2,124 72.4,128 96.5,116 120.7,120 144.9,112 169.1,118 193.3,106 217.5,100 241.6,94 265.8,86 290.0,78" stroke="#C07A5A" stroke-width="1.5" stroke-dasharray="8 3 2 3" stroke-linecap="round" stroke-linejoin="round" opacity="0.75"></polyline>

      <polyline points="24.0,126.7 48.2,115.8 72.4,120.8 96.5,99.2 120.7,87.5 144.9,93.3 169.1,70.8 193.3,60 217.5,65.8 241.6,54.2 265.8,43.3 290.0,26.7" stroke="#3FB6D4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></polyline>

      <circle cx="24.0" cy="126.7" r="2.5" fill="#0B0D0F" stroke="#3FB6D4" stroke-width="1.5"></circle>
      <circle cx="48.2" cy="115.8" r="2.5" fill="#0B0D0F" stroke="#3FB6D4" stroke-width="1.5"></circle>
      <circle cx="72.4" cy="120.8" r="2.5" fill="#0B0D0F" stroke="#3FB6D4" stroke-width="1.5"></circle>
      <circle cx="96.5" cy="99.2" r="2.5" fill="#0B0D0F" stroke="#3FB6D4" stroke-width="1.5"></circle>
      <circle cx="120.7" cy="87.5" r="2.5" fill="#0B0D0F" stroke="#3FB6D4" stroke-width="1.5"></circle>
      <circle cx="144.9" cy="93.3" r="2.5" fill="#0B0D0F" stroke="#3FB6D4" stroke-width="1.5"></circle>
      <circle cx="169.1" cy="70.8" r="2.5" fill="#0B0D0F" stroke="#3FB6D4" stroke-width="1.5"></circle>
      <circle cx="193.3" cy="60" r="2.5" fill="#0B0D0F" stroke="#3FB6D4" stroke-width="1.5"></circle>
      <circle cx="217.5" cy="65.8" r="2.5" fill="#0B0D0F" stroke="#3FB6D4" stroke-width="1.5"></circle>
      <circle cx="241.6" cy="54.2" r="2.5" fill="#0B0D0F" stroke="#3FB6D4" stroke-width="1.5"></circle>
      <circle cx="265.8" cy="43.3" r="2.5" fill="#0B0D0F" stroke="#3FB6D4" stroke-width="1.5"></circle>
      <circle cx="290.0" cy="26.7" r="3.5" fill="#3FB6D4"></circle>

      <line x1="291" y1="84" x2="295" y2="87.25" stroke="#E0A83C" stroke-width="1"></line>
      <text x="297" y="90.25" fill="#E0A83C" font-family="JetBrains Mono, monospace" font-size="9">WEIGHT 82.4</text>
      <line x1="291" y1="70" x2="295" y2="65.25" stroke="#8C7BE8" stroke-width="1"></line>
      <text x="297" y="68.25" fill="#8C7BE8" font-family="JetBrains Mono, monospace" font-size="9">INTAKE 2450</text>
      <line x1="291" y1="95" x2="295" y2="98.25" stroke="#DCD6CA" stroke-width="1"></line>
      <text x="297" y="101.25" fill="#DCD6CA" font-family="JetBrains Mono, monospace" font-size="9">SLEEP 7.2</text>
      <line x1="291" y1="78" x2="295" y2="76.25" stroke="#C07A5A" stroke-width="1"></line>
      <text x="297" y="79.25" fill="#C07A5A" font-family="JetBrains Mono, monospace" font-size="9">HRV 48</text>

      <text x="24" y="178" fill="#738393" font-family="JetBrains Mono, monospace" font-size="9">24 JUN</text>
      <text x="157.0" y="178" text-anchor="middle" fill="#738393" font-family="JetBrains Mono, monospace" font-size="9">5 AUG</text>
      <text x="290" y="178" text-anchor="end" fill="#738393" font-family="JetBrains Mono, monospace" font-size="9">16 SEP</text>
    </svg>
  </div>

  <!-- secondary stats -->
  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; padding: 6px 16px 0 16px;">
    <div style="border: 1px solid #1A2026; border-radius: 2px; padding: 12px; display: flex; flex-direction: column; gap: 6px;">
      <div style="font-size: 9px; letter-spacing: 0.1em; color: #738393;">TOP SET</div>
      <div style="display: flex; align-items: baseline; gap: 6px;">
        <div style="font-family: 'JetBrains Mono', monospace; font-size: 20px; font-weight: 500; color: #E6EDF3;">82.5</div>
        <div style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #738393;">× 10</div>
      </div>
    </div>
    <div style="border: 1px solid #1A2026; border-radius: 2px; padding: 12px; display: flex; flex-direction: column; gap: 6px;">
      <div style="font-size: 9px; letter-spacing: 0.1em; color: #738393;">VOLUME LOAD</div>
      <div style="display: flex; align-items: baseline; gap: 6px;">
        <div style="font-family: 'JetBrains Mono', monospace; font-size: 20px; font-weight: 500; color: #E6EDF3;">2,475</div>
        <div style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #738393;">kg</div>
      </div>
    </div>
  </div>

  <!-- overlays: the swatch draws each series' dash pattern (05 §4.13) -->
  <div style="padding: 20px 16px 0 16px; display: flex; flex-direction: column; gap: 9px;">
    <div style="font-size: 9px; letter-spacing: 0.12em; color: #738393;">OVERLAY</div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 7px;">
      <div style="height: 46px; display: flex; align-items: center; gap: 9px; padding: 0 12px; border: 1px solid #4A3A1C; border-radius: 2px; background: #1A1509;">
        <svg width="14" height="2" viewBox="0 0 14 2"><line x1="0" y1="1" x2="14" y2="1" stroke="#E0A83C" stroke-width="2" stroke-dasharray="3 3"></line></svg>
        <div style="font-size: 11px; letter-spacing: 0.06em; color: #E0A83C;">WEIGHT TREND</div>
      </div>
      <div style="height: 46px; display: flex; align-items: center; gap: 9px; padding: 0 12px; border: 1px solid #322E50; border-radius: 2px; background: #14151E;">
        <svg width="14" height="2" viewBox="0 0 14 2"><line x1="0" y1="1" x2="14" y2="1" stroke="#8C7BE8" stroke-width="2" stroke-dasharray="6 3"></line></svg>
        <div style="font-size: 11px; letter-spacing: 0.06em; color: #8C7BE8;">INTAKE</div>
      </div>
      <div style="height: 46px; display: flex; align-items: center; gap: 9px; padding: 0 12px; border: 1px solid #4A4947; border-radius: 2px; background: #1A1B1C;">
        <svg width="14" height="2" viewBox="0 0 14 2"><line x1="0" y1="1" x2="14" y2="1" stroke="#DCD6CA" stroke-width="2" stroke-dasharray="1.5 3"></line></svg>
        <div style="font-size: 11px; letter-spacing: 0.06em; color: #DCD6CA;">SLEEP</div>
      </div>
      <div style="height: 46px; display: flex; align-items: center; gap: 9px; padding: 0 12px; border: 1px solid #412E26; border-radius: 2px; background: #181514;">
        <svg width="14" height="2" viewBox="0 0 14 2"><line x1="0" y1="1" x2="14" y2="1" stroke="#C07A5A" stroke-width="2" stroke-dasharray="8 3 2 3"></line></svg>
        <div style="font-size: 11px; letter-spacing: 0.06em; color: #C07A5A;">HRV</div>
      </div>
    </div>
  </div>

  <!-- epley note -->
  <div style="position: absolute; left: 16px; right: 16px; bottom: 18px; display: flex; align-items: center; justify-content: space-between; padding-top: 12px; border-top: 1px solid #1A2026;">
    <div style="font-size: 10px; color: #738393;">e1RM from the best working set</div>
    <div style="font-family: 'JetBrains Mono', monospace; font-size: 10px; color: #738393;">Epley · w × (1 + r/30)</div>
  </div>

</div>
</x-dc>
</body>
</html>
