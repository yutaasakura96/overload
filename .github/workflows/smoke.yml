# After Vercel reports an API preview deployment ready, ask it to start a Google sign-in, and fail on a
# 5xx (docs/12 §5). /api/health never touches the database, so it stayed green while every auth
# route failed on a bad DATABASE_URL (docs/06, 2026-09-28). Preview covers staging (develop) and PR
# previews, which carry staging's variables (docs/12 §2).
#
# Vercel names the GitHub deployment's environment "Preview – <project>" and sets its ref to the
# commit, so the run shows as a check on that commit.
name: Smoke

on: deployment_status

permissions:
  contents: read

jobs:
  sign-in:
    if: >-
      github.event.deployment_status.state == 'success' &&
      github.event.deployment.environment == 'Preview – overload-api'
    runs-on: ubuntu-24.04
    steps:
      - name: POST /api/auth/sign-in/social answers without a 5xx
        env:
          DEPLOYMENT_URL: ${{ github.event.deployment_status.environment_url }}
        run: |
          # No Origin and no callbackURL: Better Auth answers 200 with Google's URL, after the rate
          # limiter's first database query. Nothing is sent to Google.
          status=$(curl --silent --show-error --output "$RUNNER_TEMP/body" --write-out '%{http_code}' \
            --max-time 30 --retry 2 --retry-all-errors \
            --header 'Content-Type: application/json' --data '{"provider":"google"}' \
            "$DEPLOYMENT_URL/api/auth/sign-in/social")
          echo "POST $DEPLOYMENT_URL/api/auth/sign-in/social: $status"
          if [ "$status" -ge 500 ]; then
            # The problem body holds a code and a request id, nothing secret; the cause is in Vercel's
            # function log under that request id.
            cat "$RUNNER_TEMP/body"
            echo "::error::Sign-in answered $status on $DEPLOYMENT_URL"
            exit 1
          fi
