# no-mistakes gate config. commands, agent and pr.base_branch are read only from the
# default branch (develop), not from pushed branches. This file must exist on the default branch.
allow_repo_commands: false

# Every command runs pnpm through corepack: the root scripts call `pnpm` again, and a version
# manager's shim may refuse it (AGENTS.md, Commands). `pnpm test` starts its own throwaway Postgres
# on a free port and removes it afterwards (apps/api/scripts/with-test-database.sh).
commands:
  # The run worktree has tracked files only; copy the API's local, gitignored env file in.
  prepare: '[ -f "$HOME/Documents/GitHub/overload/apps/api/.env.local" ] && cp "$HOME/Documents/GitHub/overload/apps/api/.env.local" apps/api/; corepack pnpm install --frozen-lockfile --prefer-offline'
  lint: 'd=$(mktemp -d) && corepack enable pnpm --install-directory "$d" && export PATH="$d:$PATH" && pnpm lint && pnpm typecheck'
  test: 'd=$(mktemp -d) && corepack enable pnpm --install-directory "$d" && export PATH="$d:$PATH" && pnpm test'

pr:
  base_branch: develop

test:
  instructions: |
    Never use or start a Postgres on port 5434, and never run `docker compose`: that container
    belongs to someone else. `pnpm test` starts and removes its own throwaway Postgres. Wrap any
    other database work in the same script, which picks a free port, migrates nothing itself, and
    removes only the container it started, for example:
    `E2E_API_PORT=18788 E2E_WEB_PORT=14174 sh apps/api/scripts/with-test-database.sh pnpm e2e`
    (move the E2E ports if they are taken). Playwright signs in through `pnpm dev:session`'s core
    against that database; drive the changed flow the way a user would. See AGENTS.md.
  evidence:
    attach_media: true
